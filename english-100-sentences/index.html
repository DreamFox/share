<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>小馄饨英语 100 句</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #fff7ec;
    --card: #ffffff;
    --ink: #3a2e23;
    --muted: #8a7a68;
    --brand: #ff8a52;
    --brand-dark: #f06d2e;
    --green: #4caf82;
    --shadow: 0 6px 20px rgba(180, 120, 70, .18);
  }
  html, body { background: var(--bg); color: var(--ink);
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  body { padding-bottom: 40px; }

  header { text-align: center; padding: 26px 16px 10px; }
  header h1 { font-size: 40px; letter-spacing: 2px; color: var(--brand-dark); }
  header p { margin-top: 12px; font-size: 24px; color: var(--muted); }
  header .tip { display: inline-block; margin-top: 14px; background: #ffe3cc; color: var(--brand-dark);
    font-size: 22px; font-weight: 700; padding: 10px 22px; border-radius: 999px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
    gap: 26px; padding: 24px 28px; max-width: 1400px; margin: 0 auto; }
  .card { background: var(--card); border-radius: 26px; overflow: hidden;
    box-shadow: var(--shadow); cursor: pointer; border: 3px solid transparent;
    transition: transform .12s, border-color .12s; display: block; width: 100%; text-align: left; }
  .card:active { transform: scale(.97); border-color: var(--brand); }
  .thumb { position: relative; width: 100%; aspect-ratio: 16/9; background: #f2e7d8; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .num { position: absolute; left: 16px; top: 16px; background: var(--green); color: #fff;
    font-size: 26px; font-weight: 800; min-width: 56px; height: 56px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center; padding: 0 14px;
    box-shadow: 0 3px 8px rgba(0,0,0,.2); }
  .meta { padding: 20px 22px 22px; }
  .meta .cn { font-size: 34px; font-weight: 800; }
  .meta .en { font-size: 22px; color: var(--muted); margin-top: 6px; }
  .meta .time { margin-top: 12px; font-size: 22px; color: var(--brand-dark); font-weight: 700; }
  .play-badge { float: right; background: var(--brand); color: #fff; font-size: 22px; font-weight: 800;
    padding: 10px 18px; border-radius: 999px; }

  /* 播放弹层 */
  .overlay { position: fixed; inset: 0; background: rgba(20, 14, 8, .92);
    display: none; flex-direction: column; z-index: 50; }
  .overlay.show { display: flex; }
  .player-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 18px; min-height: 0; }
  video { width: 100%; max-height: 100%; background: #000; border-radius: 14px; }
  .overlay-bar { padding: 16px 20px calc(22px + env(safe-area-inset-bottom)); display: flex;
    gap: 16px; justify-content: center; align-items: center; flex-wrap: wrap; }
  .overlay-bar .now { color: #fff; font-size: 26px; font-weight: 800; margin-right: 8px; }
  .obtn { border: none; border-radius: 999px; font-size: 28px; font-weight: 800;
    padding: 16px 34px; cursor: pointer; color: #fff; background: var(--brand); min-width: 150px; }
  .obtn:active { transform: scale(.95); }
  .obtn.green { background: var(--green); }
  .obtn.gray { background: #6b5d50; }
  .obtn:disabled { opacity: .4; }

  @media (max-width: 520px) {
    header h1 { font-size: 32px; }
    header p, header .tip { font-size: 19px; }
    .grid { grid-template-columns: 1fr; padding: 16px; gap: 18px; }
    .meta .cn { font-size: 28px; }
    .obtn { font-size: 23px; padding: 14px 24px; min-width: 120px; }
    .overlay-bar .now { width: 100%; text-align: center; margin: 0 0 4px; font-size: 22px; }
  }
</style>
</head>
<body>

<header>
  <h1>小馄饨 · 英语 100 句</h1>
  <p>跟着画面听一听、读一读</p>
  <div class="tip">👇 点一下下面的图片，就能播放</div>
</header>

<main class="grid" id="grid"></main>

<div class="overlay" id="overlay">
  <div class="player-wrap">
    <video id="player" playsinline controls preload="auto"></video>
  </div>
  <div class="overlay-bar">
    <span class="now" id="nowTitle"></span>
    <button class="obtn green" id="prevBtn">⬅ 上一个</button>
    <button class="obtn gray" id="closeBtn">关闭 ✖</button>
    <button class="obtn green" id="nextBtn">下一个 ➡</button>
  </div>
</div>

<script>
  const SCENES = [
    { n: 1, cn: "打招呼问好", en: "Greetings",       time: "2分32秒", v: "videos/scene1.mp4", t: "thumbs/thumb1.jpg" },
    { n: 2, cn: "洗漱进餐",   en: "Washing & Eating",time: "1分10秒", v: "videos/scene2.mp4", t: "thumbs/thumb2.jpg" },
    { n: 3, cn: "在园日常",   en: "Kindergarten Day",time: "1分51秒", v: "videos/scene3.mp4", t: "thumbs/thumb3.jpg" },
    { n: 4, cn: "画画与游戏", en: "Drawing & Playing",time: "25秒",    v: "videos/scene4.mp4", t: "thumbs/thumb4.jpg" },
    { n: 5, cn: "排队与指令", en: "Lining Up",       time: "44秒",    v: "videos/scene5.mp4", t: "thumbs/thumb5.jpg" },
    { n: 6, cn: "生病了",     en: "Feeling Sick",    time: "44秒",    v: "videos/scene6.mp4", t: "thumbs/thumb6.jpg" },
    { n: 7, cn: "百问百答",   en: "Questions & Answers",time: "2分13秒",v: "videos/scene7.mp4", t: "thumbs/thumb7.jpg" },
    { n: 8, cn: "入园与游戏时光", en: "Welcome & Playtime",time: "1分42秒",v: "videos/scene8.mp4",t: "thumbs/thumb8.jpg" }
  ];

  const grid = document.getElementById("grid");
  SCENES.forEach(s => {
    const card = document.createElement("button");
    card.className = "card";
    card.innerHTML = `
      <div class="thumb">
        <img src="${s.t}" alt="${s.cn}" loading="lazy">
        <span class="num">${s.n}</span>
      </div>
      <div class="meta">
        <span class="play-badge">▶ 播放</span>
        <div class="cn">${s.cn}</div>
        <div class="en">${s.en}</div>
        <div class="time">🕐 ${s.time}</div>
      </div>`;
    card.addEventListener("click", () => openPlayer(s.n - 1));
    grid.appendChild(card);
  });

  const overlay = document.getElementById("overlay");
  const player = document.getElementById("player");
  const nowTitle = document.getElementById("nowTitle");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const closeBtn = document.getElementById("closeBtn");
  let cur = 0;

  function load(i, autoplay) {
    cur = i;
    const s = SCENES[i];
    player.src = s.v;
    nowTitle.textContent = `${s.n}. ${s.cn}`;
    prevBtn.disabled = i === 0;
    nextBtn.disabled = i === SCENES.length - 1;
    if (autoplay) {
      player.play().catch(() => {});   // 个别浏览器需再点一下播放键
    }
  }

  function openPlayer(i) {
    overlay.classList.add("show");
    load(i, true);
  }
  function closePlayer() {
    overlay.classList.remove("show");
    player.pause();
    player.removeAttribute("src");
    player.load();
  }

  prevBtn.addEventListener("click", () => { if (cur > 0) load(cur - 1, true); });
  nextBtn.addEventListener("click", () => { if (cur < SCENES.length - 1) load(cur + 1, true); });
  closeBtn.addEventListener("click", closePlayer);

  // 播完一个，停 1 秒自动接着下一个
  player.addEventListener("ended", () => {
    if (cur < SCENES.length - 1) {
      nowTitle.textContent = "接下来播放下一个……";
      setTimeout(() => load(cur + 1, true), 1000);
    } else {
      nowTitle.textContent = "全部播完啦 🎉";
    }
  });
</script>
</body>
</html>
